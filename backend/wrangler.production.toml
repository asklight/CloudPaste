name = "cloudpaste"
main = "unified-entry.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "paste.asklight.us.ci", custom_domain = true }]

[vars]
ADMIN_TOKEN_EXPIRY_DAYS = "7"

[[d1_databases]]
binding = "DB"
database_name = "cloudpaste-db"
database_id = "19558330-019b-40a4-aeec-f3a58506e020"

[[workflows]]
binding = "JOB_WORKFLOW"
name = "cloudpaste-jobs"
class_name = "JobWorkflow"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/dav/*"]
